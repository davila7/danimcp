<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills</title>
  <style>
    /*@shared.css*/
    /* Horizontal bars: number of skills per category (single series, no legend needed). */
    .bars { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; margin-bottom: 16px; }
    .bar-label { font-size: 0.82rem; color: var(--muted); text-align: right; }
    .bar-track { display: flex; align-items: center; gap: 8px; min-height: 22px; border-radius: var(--radius-sm); }
    .bar-track:hover .bar, .bar-track:focus-visible .bar { filter: brightness(1.12); }
    .bar { height: 14px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
    .bar-value { font-size: 0.78rem; color: var(--text); font-variant-numeric: tabular-nums; }
    details { border-top: 1px solid var(--border); padding: 10px 0; }
    details:last-child { border-bottom: 1px solid var(--border); }
    summary { cursor: pointer; font-size: 0.88rem; font-weight: 600; }
    .group { margin-top: 8px; }
    .group .label { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Skills</h1>
  <p class="subtitle">Number of skills per category · expand a category for the full list</p>
  <div id="status">Loading skills…</div>
  <div id="content" hidden>
    <div class="bars" id="bars" role="list"></div>
    <div id="details"></div>
  </div>

  <script type="module">
    /*@shared.js*/

    const formatLabel = (key) => key.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()).replace(/\bAi\b/g, "AI").replace(/\bLlm\b/g, "LLM").replace(/\bCi Cd\b/g, "CI/CD");

    function leaves(node) {
      if (Array.isArray(node)) return node.flatMap(leaves);
      if (node && typeof node === "object") return Object.values(node).flatMap(leaves);
      return typeof node === "string" ? [node] : [];
    }

    function groups(node) {
      // Normalize a category to [[subcategory, items[]], ...]
      if (Array.isArray(node)) return [["", leaves(node)]];
      if (node && typeof node === "object") return Object.entries(node).map(([k, v]) => [k, leaves(v)]);
      return [["", leaves(node)]];
    }

    mountView("DaniMCP Skills", (data) => {
      const categories = Object.entries(data).map(([key, value]) => ({ key, value, count: leaves(value).length }));
      const max = Math.max(1, ...categories.map((c) => c.count));

      $("bars").innerHTML = categories.map((c) => {
        const tip = `${formatLabel(c.key)}: ${c.count} skill${c.count === 1 ? "" : "s"}`;
        return `<div class="bar-label" role="listitem">${esc(formatLabel(c.key))}</div>
          <div class="bar-track" tabindex="0" title="${esc(tip)}" aria-label="${esc(tip)}">
            <div class="bar" style="width:${(c.count / max) * 85}%"></div>
            <span class="bar-value">${c.count}</span>
          </div>`;
      }).join("");

      $("details").innerHTML = categories.map((c) => `<details>
          <summary>${esc(formatLabel(c.key))} (${c.count})</summary>
          ${groups(c.value).map(([sub, items]) => `<div class="group">
            ${sub ? `<div class="label">${esc(formatLabel(sub))}</div>` : ""}
            <div>${items.map((i) => `<span class="chip">${esc(i)}</span>`).join("")}</div>
          </div>`).join("")}
        </details>`).join("");

      $("content").hidden = false;
    });
  </script>
</body>
</html>
