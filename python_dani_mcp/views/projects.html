<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <style>
    /*@shared.css*/
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .project { display: flex; flex-direction: column; gap: 6px; }
    .project h2 { font-size: 1rem; font-weight: 600; }
    .project p { font-size: 0.85rem; color: var(--muted); flex: 1; }
    .project a { font-size: 0.82rem; }
  </style>
</head>
<body>
  <h1>Projects</h1>
  <p class="subtitle">Daniel Avila's featured work</p>
  <div id="status">Loading projects…</div>
  <div id="grid" class="grid"></div>

  <script type="module">
    /*@shared.js*/

    mountView("DaniMCP Projects", (data) => {
      const projects = Array.isArray(data.projects) ? data.projects : [];
      if (!projects.length) return setStatus("No projects found.");
      $("grid").innerHTML = projects.map((p) => {
        const url = safeUrl(p.link);
        return `<article class="card project">
          <h2>${esc(p.title)}</h2>
          <p>${esc(p.des ?? p.description)}</p>
          ${url ? `<a href="${esc(url)}">${esc(new URL(url).hostname.replace(/^www\./, ""))} ↗</a>` : ""}
        </article>`;
      }).join("");
    });
  </script>
</body>
</html>
