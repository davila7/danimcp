<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technologies</title>
  <style>
    /*@shared.css*/
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .level { margin-bottom: 14px; }
    .level h2 { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>Technologies</h1>
  <p class="subtitle">Daniel Avila's stack, grouped by proficiency</p>
  <div id="status">Loading technologies…</div>
  <div id="content" hidden>
    <div class="stats" id="stats"></div>
    <div id="levels"></div>
  </div>

  <script type="module">
    /*@shared.js*/

    const ORDER = ["advanced", "intermediate", "basic", "beginner"];
    const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1);

    mountView("DaniMCP Technologies", (data) => {
      const techs = Array.isArray(data.technologies) ? data.technologies : [];
      if (!techs.length) return setStatus("No technologies found.");

      const byLevel = new Map();
      for (const t of techs) {
        const level = String(t.level ?? "other").toLowerCase();
        if (!byLevel.has(level)) byLevel.set(level, []);
        byLevel.get(level).push(String(t.name ?? ""));
      }
      const rank = (l) => (ORDER.includes(l) ? ORDER.indexOf(l) : ORDER.length);
      const levels = [...byLevel.keys()].sort((a, b) => rank(a) - rank(b));

      $("stats").innerHTML = [["Total", techs.length], ...levels.map((l) => [capitalize(l), byLevel.get(l).length])]
        .map(([label, n]) => `<div class="card"><div class="stat-value">${n}</div><div class="label">${esc(label)}</div></div>`)
        .join("");

      $("levels").innerHTML = levels.map((l) => `<section class="level">
          <h2>${esc(capitalize(l))}</h2>
          <div>${byLevel.get(l).sort((a, b) => a.localeCompare(b)).map((n) => `<span class="chip">${esc(n)}</span>`).join("")}</div>
        </section>`).join("");

      $("content").hidden = false;
    });
  </script>
</body>
</html>
