<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <style>
    /*@shared.css*/
    .profile { max-width: 440px; margin: 0 auto; }
    .header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-weight: 600; font-size: 1.2rem;
      background: var(--accent-soft); color: var(--accent);
    }
    .occupation { color: var(--muted); font-size: 0.9rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
    .grid .wide { grid-column: 1 / -1; }
    .value { font-size: 0.9rem; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="status">Loading profile…</div>
  <div id="content" class="card profile" hidden>
    <div class="header">
      <div class="avatar" id="initials" aria-hidden="true"></div>
      <div>
        <h1 id="name"></h1>
        <div class="occupation" id="occupation"></div>
      </div>
    </div>
    <div class="grid">
      <div><div class="label">Location</div><div class="value" id="location"></div></div>
      <div><div class="label">Age</div><div class="value" id="age"></div></div>
      <div class="wide"><div class="label">Education</div><div class="value" id="education"></div></div>
    </div>
  </div>

  <script type="module">
    /*@shared.js*/

    mountView("DaniMCP Profile", (data) => {
      const name = data.name ?? "";
      $("initials").textContent = name.split(/\s+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("");
      for (const field of ["name", "occupation", "location", "age", "education"]) {
        $(field).textContent = data[field] ?? "—";
      }
      $("content").hidden = false;
    });
  </script>
</body>
</html>
